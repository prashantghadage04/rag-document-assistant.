<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Document Assistant</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; }
    .app { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #666; margin-bottom: 16px; font-size: 14px; }
    .chat { background: #fff; border-radius: 12px; padding: 16px; min-height: 320px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; }
    .user { background: #2563eb; color: #fff; margin-left: 20%; }
    .bot { background: #eef0f3; margin-right: 10%; }
    .src { font-size: 12px; color: #555; margin-top: 8px; border-top: 1px solid #d5d8dd; padding-top: 6px; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { padding: 12px 20px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const API = window.location.origin.startsWith("http") ? window.location.origin : "http://localhost:8000";

    function App() {
      const [messages, setMessages] = useState([
        { role: "bot", text: "Hi! Ask me anything about the company leave, remote-work or IT policy documents." },
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);

      async function send(e) {
        e.preventDefault();
        const q = input.trim();
        if (!q) return;
        setMessages((m) => [...m, { role: "user", text: q }]);
        setInput("");
        setLoading(true);
        try {
          const res = await fetch(`${API}/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q }),
          });
          const data = await res.json();
          setMessages((m) => [...m, { role: "bot", text: data.answer, sources: data.sources }]);
        } catch (err) {
          setMessages((m) => [...m, { role: "bot", text: "Error: could not reach the backend." }]);
        }
        setLoading(false);
      }

      return (
        <div className="app">
          <h1>RAG Document Assistant</h1>
          <div className="sub">Retrieval-Augmented Generation over your documents</div>
          <div className="chat">
            {messages.map((m, i) => (
              <div key={i} className={`msg ${m.role}`}>
                {m.text}
                {m.sources && m.sources.length > 0 && (
                  <div className="src">
                    Sources: {m.sources.map((s) => `${s.source} (${s.score})`).join(", ")}
                  </div>
                )}
              </div>
            ))}
            {loading && <div className="msg bot">Thinking...</div>}
          </div>
          <form onSubmit={send}>
            <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="e.g. How many sick leave days do I get?" />
            <button disabled={loading}>Ask</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
